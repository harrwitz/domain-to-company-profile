[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-enrichment-agent"
version = "0.1.0"
description = "Autonomous Lead Enrichment Agent using Playwright and OpenAI structured outputs"
authors = [{ name = "AI Engineering Candidate" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.6.0",
    "markdownify>=0.11.0",
    "pydantic>=2.5.0",
    "openai>=1.10.0",
    "instructor>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
